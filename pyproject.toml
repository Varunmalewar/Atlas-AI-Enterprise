[project]
name = "atlas-ai-enterprise"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Varun Malewar", email = "vmmalewar@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.123",
    "docx>=0.2.4",
    "dotenv>=0.9.9",
    "fastapi>=0.162.0",
    "langgraph>=1.2.20",
    "pinecone>=10.3.0",
    "psycopg>=3.3.8",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
]

[project.scripts]
atlas-ai-enterprise = "atlas_ai_enterprise:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
